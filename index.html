<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plano de Treino</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171A;
    --steel:#20252C;
    --steel-2:#2A303A;
    --line:#3A4048;
    --chalk:#EDEDE6;
    --chalk-dim:#9BA3AC;
    --yellow:#E8B93F;
    --yellow-dim:#8A6E28;
    --ok:#5FA779;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'Barlow', sans-serif;
    -webkit-tap-highlight-color:transparent;
    height:100%;
    overflow:hidden;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
  }

  .fixed-header{
    flex:0 0 auto;
    background:var(--ink);
  }
  .scroll-area{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:50px;
  }

  header.top{
    padding:22px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  header.top .kicker{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:.08em;
    color:var(--yellow);
    text-transform:uppercase;
  }
  header.top h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:51px;
    line-height:1;
    margin:6px 0 0;
    letter-spacing:.01em;
  }

  nav.days{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:8px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  nav.days button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--chalk-dim);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:21px;
    letter-spacing:.02em;
    padding:12px 4px;
    border-radius:4px;
    cursor:pointer;
  }
  nav.days button.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:var(--ink);
  }

  .day-head{
    padding:18px 18px 10px;
  }
  .day-head .title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:39px;
    margin:0;
  }
  .day-head .sub{
    color:var(--chalk-dim);
    font-size:23px;
    margin-top:2px;
  }

  .progress-wrap{
    padding:0 18px 18px;
  }
  .progress-bar{
    height:8px;
    background:var(--steel-2);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--yellow);
    width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-size:20px;
    color:var(--chalk-dim);
    margin-top:6px;
  }

  #groups{ padding:0 18px; }

  .ex-card{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--steel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 16px;
    margin-bottom:10px;
    margin-top:12px;
  }
  .ex-card.done{
    border-color:var(--ok);
    background:#1B2620;
  }
  .ex-check{
    flex:0 0 auto;
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    margin-top:2px;
    cursor:pointer;
    position:relative;
  }
  .ex-check.done{
    background:var(--ok);
    border-color:var(--ok);
  }
  .ex-check.done::after{
    content:'';
    position:absolute;
    left:9px; top:4px;
    width:8px; height:14px;
    border:solid var(--ink);
    border-width:0 3px 3px 0;
    transform:rotate(45deg);
  }
  .ex-body{flex:1; min-width:0;}
  .ex-name-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .ex-name{
    font-weight:600;
    font-size:24px;
  }
  .ex-card.done .ex-name{
    color:var(--chalk-dim);
    text-decoration:line-through;
  }
  .tag-principal{
    font-family:'Barlow Condensed',sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--yellow);
    border:1px solid var(--yellow-dim);
    border-radius:2px;
    padding:1px 6px;
    text-transform:uppercase;
  }
  .tag-group{
    font-family:'Barlow Condensed',sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--chalk-dim);
    border:1px solid var(--line);
    border-radius:2px;
    padding:1px 6px;
    text-transform:uppercase;
  }
  .move-controls{
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:0 0 auto;
    margin-left:auto;
  }
  .move-btn{
    width:38px;
    height:32px;
    border-radius:4px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--chalk-dim);
    font-size:16px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .move-btn:disabled{
    opacity:.25;
    cursor:default;
  }
  .ex-scheme{
    font-size:21px;
    color:var(--chalk-dim);
    margin-top:2px;
  }
  .ex-note{
    font-size:20px;
    color:var(--chalk-dim);
    margin-top:4px;
    font-style:italic;
  }
  .ex-muscles{
    font-size:20px;
    color:var(--chalk-dim);
    margin-top:6px;
  }
  .ex-muscles b{
    color:var(--chalk);
    font-weight:600;
  }
  .ex-image{
    width:100%;
    max-width:320px;
    height:180px;
    object-fit:cover;
    border-radius:4px;
    margin-bottom:10px;
    display:block;
    border:1px solid var(--line);
  }

  .sets-row{
    margin-top:10px;
  }
  .sets-row .sets-label{
    display:block;
    font-size:18px;
    color:var(--chalk-dim);
    margin-bottom:6px;
  }
  .sets-buttons{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:1fr;
    gap:6px;
  }
  .set-btn{
    width:100%;
    height:44px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--chalk-dim);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .set-btn.done{
    background:var(--ok);
    border-color:var(--ok);
    color:var(--ink);
  }

  .weight-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
  }
  .weight-row label{
    font-size:18px;
    color:var(--chalk-dim);
  }
  .weight-row .weight-input-wrap{
    display:flex;
    align-items:center;
    background:var(--steel-2);
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:0 8px;
  }
  .weight-row input{
    width:76px;
    background:transparent;
    border:none;
    outline:none;
    color:var(--chalk);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:24px;
    padding:10px 2px;
    text-align:right;
    -moz-appearance:textfield;
  }
  .weight-row input::-webkit-outer-spin-button,
  .weight-row input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .weight-row .unit{
    font-size:20px;
    color:var(--chalk-dim);
    padding-left:2px;
  }

  .reset-row{
    padding:6px 18px 10px;
  }
  .reset-btn{
    width:100%;
    background:transparent;
    border:1px solid var(--line);
    color:var(--chalk-dim);
    font-family:'Barlow',sans-serif;
    font-size:21px;
    padding:14px;
    border-radius:4px;
    cursor:pointer;
  }
  .reset-btn:active{background:var(--steel-2);}

  .footer-note{
    padding:6px 18px 0;
    font-size:19px;
    color:var(--chalk-dim);
    line-height:1.5;
  }

  .timer-fab{
    position:fixed;
    right:20px;
    bottom:24px;
    width:72px;
    height:72px;
    border-radius:50%;
    background:var(--yellow);
    color:var(--ink);
    border:none;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    cursor:pointer;
    z-index:30;
  }
  .timer-fab.running{
    background:var(--ok);
    font-size:19px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="fixed-header">
    <header class="top">
      <h1>Plano de treino</h1>
    </header>

    <nav class="days" id="dayNav"></nav>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
  </div>

  <div class="scroll-area">
    <div id="groups"></div>

    <div class="reset-row">
      <button class="reset-btn" id="resetBtn">Reiniciar marcação de hoje</button>
    </div>
    <div class="reset-row" style="padding-top:0;">
      <button class="reset-btn" id="resetOrderBtn">Restaurar ordem padrão dos exercícios</button>
    </div>

    <p class="footer-note">Cardio de 10–15 min encerra todos os dias. Priorize o exercício principal com energia fresca — se o tempo apertar, corte séries dos isolados antes.</p>
  </div>
</div>

<button class="timer-fab" id="timerBtn">⏱</button>

        { id:"ter-1", name:"Supino reto com halteres", scheme:"3 séries x 8-10 reps", sets:3 , muscles:["Peitoral maior", "Tríceps", "Deltoide anterior"]},
        { id:"ter-2", name:"Supino inclinado (halteres)", scheme:"3 séries x 10-12 reps", sets:3 , muscles:["Peitoral maior (porção superior)", "Deltoide anterior", "Tríceps"]},
        { id:"ter-3", name:"Crucifixo ou peck deck", scheme:"2-3 séries x 12-15 reps", sets:3 , muscles:["Peitoral maior"]},
      ]},
      { name: "Bíceps", exs: [
        { id:"ter-4", name:"Rosca direta com halteres", scheme:"3 séries x 10-12 reps", sets:3 , muscles:["Bíceps"]},
        { id:"ter-5", name:"Rosca alternada ou martelo", scheme:"2-3 séries x 12 reps", sets:3 , muscles:["Bíceps", "Braquial"]},
      ]},

        { id:"sex-2", name:"Face pull (cabo/polia)", scheme:"3 séries x 12-15 reps", sets:3 , muscles:["Deltoide posterior", "Trapézio médio", "Romboides"], image:"images/face-pull.jpg"},
        { id:"sex-3", name:"Remada alta", scheme:"2-3 séries x 10-12 reps", sets:3 , muscles:["Trapézio", "Deltoide lateral"]},
      ]},

const DAY_ORDER = ["seg","ter","qua","qui","sex"];
let currentDay = DAY_ORDER[0];

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

// Índice de exercícios + ordem padrão (a mesma definida no PLAN), montado uma vez.
const EXERCISE_INDEX = {};
const DEFAULT_ORDER = {};
DAY_ORDER.forEach(day=>{
  EXERCISE_INDEX[day] = {};
  DEFAULT_ORDER[day] = [];
  PLAN[day].groups.forEach(group=>{
    group.exs.forEach(ex=>{
      EXERCISE_INDEX[day][ex.id] = { ex, groupName: group.name };
      DEFAULT_ORDER[day].push(ex.id);
    });
  });
});

// Tudo fica numa única chave: séries marcadas de hoje (resetam a cada dia),
// cargas e ordem personalizada dos exercícios (permanentes, até o usuário alterar).
const APP_KEY = 'treino-dados';
let appData = { date: todayStr(), checked: {}, weights: {}, order: {} };

function loadAppData(){
  try{
    const raw = localStorage.getItem(APP_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      appData.weights = parsed.weights || {};
      appData.order = parsed.order || {};
      appData.checked = (parsed.date === todayStr()) ? (parsed.checked || {}) : {};
    }
  }catch(e){
    console.warn('Não foi possível carregar os dados salvos neste navegador.', e);
  }
}

function persistNow(){
  appData.date = todayStr();
  try{
    localStorage.setItem(APP_KEY, JSON.stringify(appData));
  }catch(e){
    console.warn('Não foi possível salvar neste navegador.', e);
  }
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 400);
}
function flushSave(){
  clearTimeout(saveTimer);
  persistNow();
}

function getOrderForDay(day){
  const custom = appData.order[day];
  const valid = custom && custom.length === DEFAULT_ORDER[day].length &&
    custom.every(id => EXERCISE_INDEX[day][id]);
  return valid ? custom.slice() : DEFAULT_ORDER[day].slice();
}

function moveExercise(day, id, direction){
  const order = getOrderForDay(day);
  const idx = order.indexOf(id);
  const swapWith = idx + direction;
  if(swapWith < 0 || swapWith >= order.length) return;
  [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
  appData.order[day] = order;
  scheduleSave();
  renderDay();
}

function renderNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  DAY_ORDER.forEach(key=>{
    const btn = document.createElement('button');
    btn.textContent = PLAN[key].label;
    if(key === currentDay) btn.classList.add('active');
    btn.onclick = ()=>{ currentDay = key; render(); };
    nav.appendChild(btn);
  });
}

// Retorna a lista de "unidades" marcáveis de um exercício:
// uma por série (ex.sets > 0), ou uma única unidade para itens sem série (cardio).
function unitsFor(ex){
  if(ex.sets && ex.sets > 0){
    const units = [];
    for(let i=1; i<=ex.sets; i++) units.push(`${ex.id}-s${i}`);
    return units;
  }
  return [ex.id];
}

function renderDay(){
  const order = getOrderForDay(currentDay);
  const orderedExs = order.map(id => EXERCISE_INDEX[currentDay][id]);

  const allUnits = orderedExs.flatMap(({ex})=>unitsFor(ex));
  const total = allUnits.length;
  const done = allUnits.filter(u=>appData.checked[u]).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} de ${total} séries concluídas`;

  const groupsEl = document.getElementById('groups');
  groupsEl.innerHTML = '';

  const list = document.createElement('div');
  list.className = 'ex-list';

  orderedExs.forEach(({ex, groupName}, idx)=>{
    const units = unitsFor(ex);
    const isDone = units.every(u=>appData.checked[u]);
    const card = document.createElement('div');
    card.className = 'ex-card' + (isDone ? ' done' : '');

    const body = document.createElement('div');
    body.className = 'ex-body';

    if(ex.image){
      const img = document.createElement('img');
      img.className = 'ex-image';
      img.src = ex.image;
      img.alt = ex.name;
      img.loading = 'lazy';
      body.appendChild(img);
    }

    const nameRow = document.createElement('div');
    nameRow.className = 'ex-name-row';
    const groupTag = document.createElement('span');
    groupTag.className = 'tag-group';
    groupTag.textContent = groupName;
    nameRow.appendChild(groupTag);
    const name = document.createElement('span');
    name.className = 'ex-name';
    name.textContent = ex.name;
    nameRow.appendChild(name);
    if(ex.principal){
      const tag = document.createElement('span');
      tag.className = 'tag-principal';
      tag.textContent = 'Principal';
      nameRow.appendChild(tag);
    }

    const scheme = document.createElement('div');
    scheme.className = 'ex-scheme';
    scheme.textContent = ex.scheme;

    body.appendChild(nameRow);
    body.appendChild(scheme);

    if(ex.note){
      const note = document.createElement('div');
      note.className = 'ex-note';
      note.textContent = ex.note;
      body.appendChild(note);
    }

    if(ex.muscles && ex.muscles.length){
      const musclesEl = document.createElement('div');
      musclesEl.className = 'ex-muscles';
      const b = document.createElement('b');
      b.textContent = 'Músculos: ';
      musclesEl.appendChild(b);
      musclesEl.appendChild(document.createTextNode(ex.muscles.join(', ')));
      body.appendChild(musclesEl);
    }

    if(ex.sets && ex.sets > 0){
      const setsRow = document.createElement('div');
      setsRow.className = 'sets-row';
      const label = document.createElement('span');
      label.className = 'sets-label';
      label.textContent = 'Séries:';
      setsRow.appendChild(label);
      const setsButtons = document.createElement('div');
      setsButtons.className = 'sets-buttons';
      units.forEach((unit, i)=>{
        const b = document.createElement('button');
        b.className = 'set-btn' + (appData.checked[unit] ? ' done' : '');
        b.textContent = String(i+1);
        b.onclick = ()=>{
          appData.checked[unit] = !appData.checked[unit];
          scheduleSave();
          renderDay();
        };
        setsButtons.appendChild(b);
      });
      setsRow.appendChild(setsButtons);
      body.appendChild(setsRow);

      const weightRow = document.createElement('div');
      weightRow.className = 'weight-row';
      const wLabel = document.createElement('label');
      wLabel.textContent = 'Carga:';
      wLabel.setAttribute('for', 'w-'+ex.id);
      const inputWrap = document.createElement('div');
      inputWrap.className = 'weight-input-wrap';
      const wInput = document.createElement('input');
      wInput.type = 'number';
      wInput.step = '0.5';
      wInput.min = '0';
      wInput.id = 'w-'+ex.id;
      wInput.placeholder = '0';
      wInput.value = appData.weights[ex.id] !== undefined ? appData.weights[ex.id] : '';
      wInput.oninput = ()=>{
        appData.weights[ex.id] = wInput.value;
        scheduleSave();
      };
      wInput.onblur = ()=>{
        flushSave();
      };
      const unitSpan = document.createElement('span');
      unitSpan.className = 'unit';
      unitSpan.textContent = 'kg';
      inputWrap.appendChild(wInput);
      inputWrap.appendChild(unitSpan);
      weightRow.appendChild(wLabel);
      weightRow.appendChild(inputWrap);
      body.appendChild(weightRow);

      card.appendChild(body);
    } else {
      const check = document.createElement('div');
      check.className = 'ex-check' + (isDone ? ' done' : '');
      check.onclick = ()=>{
        appData.checked[ex.id] = !appData.checked[ex.id];
        scheduleSave();
        renderDay();
      };
      card.appendChild(check);
      card.appendChild(body);
    }

    const moveControls = document.createElement('div');
    moveControls.className = 'move-controls';
    const upBtn = document.createElement('button');
    upBtn.className = 'move-btn';
    upBtn.textContent = '▲';
    upBtn.disabled = idx === 0;
    upBtn.onclick = ()=> moveExercise(currentDay, ex.id, -1);
    const downBtn = document.createElement('button');
    downBtn.className = 'move-btn';
    downBtn.textContent = '▼';
    downBtn.disabled = idx === orderedExs.length - 1;
    downBtn.onclick = ()=> moveExercise(currentDay, ex.id, 1);
    moveControls.appendChild(upBtn);
    moveControls.appendChild(downBtn);
    card.appendChild(moveControls);

    list.appendChild(card);
  });

  groupsEl.appendChild(list);
}

function render(){
  renderNav();
  renderDay();
}

document.getElementById('resetBtn').onclick = ()=>{
  appData.checked = {};
  flushSave();
  renderDay();
};

document.getElementById('resetOrderBtn').onclick = ()=>{
  delete appData.order[currentDay];
  flushSave();
  renderDay();
};

(async function init(){
  const weekday = new Date().getDay();
  const map = {1:"seg",2:"ter",3:"qua",4:"qui",5:"sex"};
  if(map[weekday]) currentDay = map[weekday];

  loadAppData();
  render();

  window.addEventListener('pagehide', flushSave);
  window.addEventListener('beforeunload', flushSave);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();

// Cronômetro simples de descanso entre séries: toca pra iniciar, toca de novo pra zerar.
(function initTimer(){
  const timerBtn = document.getElementById('timerBtn');
  let timerInterval = null;
  let timerSeconds = 0;
  let timerRunning = false;

  function formatTime(total){
    const m = String(Math.floor(total/60)).padStart(2,'0');
    const s = String(total%60).padStart(2,'0');
    return `${m}:${s}`;
  }

  timerBtn.onclick = ()=>{
    if(!timerRunning){
      timerRunning = true;
      timerSeconds = 0;
      timerBtn.textContent = formatTime(timerSeconds);
      timerBtn.classList.add('running');
      timerInterval = setInterval(()=>{
        timerSeconds++;
        timerBtn.textContent = formatTime(timerSeconds);
      }, 1000);
    } else {
      timerRunning = false;
      clearInterval(timerInterval);
      timerSeconds = 0;
      timerBtn.textContent = '⏱';
      timerBtn.classList.remove('running');
    }
  };
})();
</script>
